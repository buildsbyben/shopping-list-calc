plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "io.github.buildsbyben.shoppinglistcalc"
    compileSdk 35

    def releaseStoreFile = System.getenv("SHOPPING_CALC_STORE_FILE")

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("SHOPPING_CALC_STORE_PASSWORD")
                keyAlias System.getenv("SHOPPING_CALC_KEY_ALIAS")
                keyPassword System.getenv("SHOPPING_CALC_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "io.github.buildsbyben.shoppinglistcalc"
        minSdk 23
        targetSdk 35
        versionCode 16
        versionName "2.1"
    }

    // Enable Jetpack Compose build features
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // F-Droid rejects APKs containing AGP's dependency-metadata signing block.
    // The dependency graph remains in the public source; it does not need to
    // be embedded in the distributable APK.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildTypes {
        debug {
            // Keeps test builds installable beside the F-Droid release.
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        release {
            // F-Droid builds unsigned release APKs and signs them itself.
            // Local release builds use this signing config only when supplied.
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    // Import the Compose BOM to align version management
    def composeBom = platform("androidx.compose:compose-bom:2024.02.01")
    implementation composeBom
    androidTestImplementation composeBom

    // Compose Foundation & Material 3 components
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.8.2"

    // Android Studio Layout Inspector & Preview tooling
    debugImplementation "androidx.compose.ui:ui-tooling"
}