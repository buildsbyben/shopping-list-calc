plugins {
    id "com.android.application"
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "io.github.buildsbyben.shoppinglistcalc"
    compileSdk 35

    def releaseStoreFile = System.getenv("SHOPPING_CALC_STORE_FILE")

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("SHOPPING_CALC_STORE_PASSWORD")
                keyAlias System.getenv("SHOPPING_CALC_KEY_ALIAS")
                keyPassword System.getenv("SHOPPING_CALC_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "io.github.buildsbyben.shoppinglistcalc"
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName "2.2"
    }

    // F-Droid rejects APKs containing AGP's dependency-metadata signing block.
    // The dependency graph remains in the public source; it does not need to
    // be embedded in the distributable APK.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildTypes {
        debug {
            // Keeps test builds installable beside the F-Droid release.
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        release {
            // F-Droid builds unsigned release APKs and signs them itself.
            // Local release builds use this signing config only when supplied.
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            // Remove unused application/library code and resources from release APKs.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        r8Smoke {
            // Exercise release optimization without replacing an installed release.
            initWith release
            applicationIdSuffix '.r8test'
            versionNameSuffix '-r8-test'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation "org.json:json:20231013"
}
